[project]
name = "ratspeak-mcp"
version = "0.1.0"
description = "Local stdio MCP connector for Ratspeak / LXMF (Reticulum mesh messaging)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lxmf>=1.1.1",
    "mcp>=1.0",
    "rns>=1.5.4",
]

[project.scripts]
ratspeak-mcp = "ratspeak_mcp:main"
ratspeak-bridge = "ratspeak_mcp.daemon:main"
ratspeak-send = "ratspeak_mcp.send_cli:main"
ratspeak-webhook = "ratspeak_mcp.webhook:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
